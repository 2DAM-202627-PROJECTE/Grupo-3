<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Estilos de la página (Tailwind + style.css). Van con <link> y no importados desde
         main.js para que todas las páginas los carguen igual (ver el comentario en main.js).
         Además así se aplican antes de que se ejecute el JavaScript -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Estilos de la intro animada (src/intro/Intro.js), que solo se ve la primera vez -->
    <link rel="stylesheet" href="/src/intro/intro.css" />
    <meta name="description" content="Reservo: sistema de reservas online para gimnasios, restaurantes, peluquerías y clínicas." />
    <title>Reservo · Reservas online para tu negocio</title>
  </head>
  <body class="bg-(--bg) text-slate-900 antialiased">
    <!-- Fondo aurora de toda la página (manchas de color pastel, ver style.css apartado 6).
         Es decorativo: aria-hidden para que los lectores de pantalla lo ignoren -->
    <div class="page-aurora" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
